AllCops:
  NewCops: enable
  SuggestExtensions: false
  TargetRubyVersion: 3.2

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/ClassLength:
  Enabled: false

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 40
  Exclude:
    - spec/**/*

Metrics/CyclomaticComplexity:
  Max: 14

Metrics/PerceivedComplexity:
  Max: 14

Layout/LineLength:
  Max: 120

Naming/AccessorMethodName:
  Enabled: false

Naming/MethodParameterName:
  AllowedNames: [x, y, id]

plugins:
  - rubocop-rspec

RSpec/ExampleLength:
  Max: 20

RSpec/MultipleExpectations:
  Enabled: false

# Constants stay next to the methods that use them.
Lint/UselessConstantScoping:
  Enabled: false

Metrics/ParameterLists:
  Exclude:
    - spec/support/**/*
